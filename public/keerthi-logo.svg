<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 126" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&amp;family=Montserrat:wght@800;900&amp;display=swap');
      .brand-serif {
        font-family: 'Playfair Display', 'Times New Roman', Georgia, serif;
        font-weight: 900;
      }
      .brand-sans-bold {
        font-family: 'Montserrat', Arial, -apple-system, sans-serif;
        font-weight: 900;
      }
      .brand-subtitle {
        font-family: 'Montserrat', Arial, -apple-system, sans-serif;
        font-weight: 800;
      }
    </style>
  </defs>

  <!-- Left Emblem: Charcoal Serif "I" and Vibrant Green "K" dynamic student figure -->
  <g transform="translate(6, 6)">
    <!-- Charcoal 'I' Pillar with Top and Bottom Serifs -->
    <path
      d="M 12 14 L 72 14 L 72 26 L 54 26 L 54 88 L 72 88 L 72 100 L 12 100 L 12 88 L 30 88 L 30 26 L 12 26 Z"
      fill="#3a3d42"
    />
    
    <!-- Charcoal Head / Dot of the Figure -->
    <circle cx="94" cy="22" r="11" fill="#3a3d42" />

    <!-- Green Dynamic K Upper Arm -->
    <polygon points="52,48 76,23 94,36 68,64" fill="#38a124" />

    <!-- Green Dynamic K Lower Leg with Foot Base -->
    <polygon points="62,60 98,100 116,100 116,108 88,108 52,72" fill="#38a124" />
  </g>

  <!-- Right Typography Section -->
  <g transform="translate(136, 0)">
    <!-- Line 1: KEERTHI INFOTECH -->
    <text x="0" y="44" class="brand-serif" font-size="39" fill="#0a2550" letter-spacing="1">KEERTHI</text>
    <text x="182" y="44" class="brand-sans-bold" font-size="39" fill="#38a124" letter-spacing="0.5">INFOTECH</text>

    <!-- Line 2: — COMPUTER EDUCATION — -->
    <g transform="translate(192, 68)">
      <line x1="-188" y1="-5" x2="-164" y2="-5" stroke="#0a2550" stroke-width="2.5" stroke-linecap="round" />
      <text x="0" y="0" text-anchor="middle" class="brand-subtitle" font-size="16" fill="#0a2550" letter-spacing="3.5">COMPUTER EDUCATION</text>
      <line x1="164" y1="-5" x2="188" y2="-5" stroke="#0a2550" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Line 3: EMPOWERING MINDS. BUILDING FUTURES. -->
    <text x="192" y="88" text-anchor="middle" class="brand-subtitle" font-size="12" fill="#0a2550" letter-spacing="1.2">EMPOWERING MINDS. BUILDING FUTURES.</text>

    <!-- Line 4: — SINCE 1999 — -->
    <g transform="translate(192, 112)">
      <line x1="-192" y1="-5" x2="-68" y2="-5" stroke="#38a124" stroke-width="2" stroke-linecap="round" />
      <text x="0" y="0" text-anchor="middle" class="brand-sans-bold" font-size="14.5" fill="#38a124" letter-spacing="2">SINCE 1999</text>
      <line x1="68" y1="-5" x2="192" y2="-5" stroke="#38a124" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>
